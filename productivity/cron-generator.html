<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Affilore Cron OS — Gamified Scheduling Architecture</title>
  <meta name="description" content="Enterprise-grade cron expression generator, parser, and timeline predictor with client-side execution."/>

  <!-- Premium Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS & Engine CDNs -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdn.jsdelivr.net/npm/cronstrue@latest/dist/cronstrue.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            obsidian:    '#050506',
            panel:       '#0D0D11',
            borderNode:  '#16161C',
            amberCore:   '#F5A623',
            emeraldCore: '#10B981',
            cyanCore:    '#06B6D4',
            purpleCore:  '#A855F7',
            roseCore:    '#F43F5E',
            indigoCore:  '#6366F1'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        },
      },
    };
  </script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { background-color: #000000; scroll-behavior: smooth; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #000000; color: #FFFFFF; overflow-x: hidden; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #000000; }
    ::-webkit-scrollbar-thumb { background: rgba(245,166,35,0.25); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #F5A623; }

    /* ─── GLASSMORPHISM & BORDERS ─── */
    .glass { background: rgba(13, 13, 17, 0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
    .glass-nav { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }

    /* ─── NEON GLOW EFFECTS ─── */
    .neon-amber { box-shadow: 0 0 20px rgba(245, 166, 35, 0.25), inset 0 0 20px rgba(245,166,35,0.05); }
    .neon-cyan { box-shadow: 0 0 20px rgba(6, 182, 212, 0.25), inset 0 0 20px rgba(6,182,212,0.05); }
    .neon-emerald { box-shadow: 0 0 20px rgba(16, 185, 129, 0.25), inset 0 0 20px rgba(16,185,129,0.05); }
    .neon-purple { box-shadow: 0 0 20px rgba(168, 85, 247, 0.25), inset 0 0 20px rgba(168,85,247,0.05); }
    .neon-rose { box-shadow: 0 0 20px rgba(244, 63, 94, 0.25), inset 0 0 20px rgba(244,63,94,0.05); }

    /* ─── PREMIUM MULTI-COLORED WORKSPACE BOXES ─── */
    .box-purple { background: rgba(30, 27, 75, 0.25); border: 1px solid rgba(168, 85, 247, 0.3); border-top: 3px solid #A855F7; }
    .box-emerald { background: rgba(6, 78, 59, 0.25); border: 1px solid rgba(16, 185, 129, 0.3); border-top: 3px solid #10B981; }
    .box-amber { background: rgba(120, 53, 4, 0.25); border: 1px solid rgba(245, 166, 35, 0.3); border-top: 3px solid #F5A623; }
    .box-rose { background: rgba(76, 5, 25, 0.25); border: 1px solid rgba(244, 63, 94, 0.3); border-top: 3px solid #F43F5E; }
    .box-cyan { background: rgba(8, 51, 68, 0.25); border: 1px solid rgba(6, 182, 212, 0.3); border-top: 3px solid #06B6D4; }

    /* ─── PREMIUM REFERENCE BOXES (ARTICLE THEME) ─── */
    .ref-purple {
      background: rgba(168, 85, 247, 0.03);
      border: 1px solid rgba(168, 85, 247, 0.15);
      border-left: 4px solid #A855F7;
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    }
    .ref-emerald {
      background: rgba(16, 185, 129, 0.03);
      border: 1px solid rgba(16, 185, 129, 0.15);
      border-left: 4px solid #10B981;
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    }
    .ref-cyan {
      background: rgba(6, 182, 212, 0.03);
      border: 1px solid rgba(6, 182, 212, 0.15);
      border-left: 4px solid #06B6D4;
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    }
    .ref-rose {
      background: rgba(244, 63, 94, 0.03);
      border: 1px solid rgba(244, 63, 94, 0.15);
      border-left: 4px solid #F43F5E;
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    }

    /* ─── ANIMATED GRADIENT TEXT ─── */
    @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .animated-gradient-text {
      background: linear-gradient(270deg, #10B981, #06B6D4, #A855F7, #10B981);
      background-size: 300% 300%;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      animation: gradientShift 6s ease infinite;
    }

    /* ─── CUSTOM INPUTS ─── */
    .input-tech {
      background-color: rgba(5, 5, 6, 0.8);
      border: 1px solid rgba(245,166,35,0.12);
      color: #FFFFFF;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .input-tech:focus {
      border-color: #F5A623;
      box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15), 0 0 30px rgba(245,166,35,0.08);
    }
    .input-tech::placeholder { color: rgba(245,166,35,0.3); }

    /* ─── CRON SEGMENT PILLS ─── */
    .cron-seg {
      display: inline-block; padding: 0.25rem 0.75rem; margin: 0.2rem 0.2rem;
      border-radius: 6px; font-weight: 700; font-family: 'JetBrains Mono', monospace; font-size: 1rem;
    }
    .cron-seg.min { color: #A855F7; background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.3); }
    .cron-seg.hr  { color: #06B6D4; background: rgba(6,182,212,0.15); border: 1px solid rgba(6,182,212,0.3); }
    .cron-seg.dom { color: #F5A623; background: rgba(245,166,35,0.15); border: 1px solid rgba(245,166,35,0.3); }
    .cron-seg.mon { color: #F43F5E; background: rgba(244,63,94,0.15); border: 1px solid rgba(244,63,94,0.3); }
    .cron-seg.dow { color: #10B981; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); }

    /* Pulse Dot */
    .pulse-dot { animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* ─── NAV NEON UNDERLINE SWEEP ─── */
    .nav-link {
      position: relative;
      transition: color 0.3s;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #F5A623, #06B6D4);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 2px;
    }
    .nav-link:hover::after { width: 100%; }
    .nav-link:hover { color: #FFFFFF !important; }

    /* ─── BUTTON RIPPLE EFFECT ─── */
    .btn-ripple {
      position: relative;
      overflow: hidden;
    }
    .btn-ripple .ripple-wave {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transform: scale(0);
      animation: ripple-expand 0.6s ease-out forwards;
      pointer-events: none;
    }
    @keyframes ripple-expand {
      to { transform: scale(4); opacity: 0; }
    }

    /* ─── SCROLL REVEAL ─── */
    .scroll-reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .scroll-reveal.animate-in {
      opacity: 1;
      transform: translateY(0);
    }

    /* ─── GLOWING BORDER PULSE ─── */
    @keyframes borderGlow {
      0%, 100% { border-color: rgba(245,166,35,0.12); }
      50% { border-color: rgba(245,166,35,0.4); }
    }
    .glow-typing { animation: borderGlow 1.5s ease infinite; }

    /* ─── LIVE COUNTDOWN ─── */
    .countdown-digit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.5rem;
      height: 2.8rem;
      background: rgba(16,185,129,0.08);
      border: 1px solid rgba(16,185,129,0.25);
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 1.4rem;
      color: #10B981;
      text-shadow: 0 0 12px rgba(16,185,129,0.5);
      transition: all 0.3s;
    }
    .countdown-sep {
      color: rgba(16,185,129,0.5);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 1.2rem;
      animation: blink-sep 1s step-end infinite;
      margin: 0 2px;
    }
    @keyframes blink-sep {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* ─── FEATURE TABS ─── */
    .feature-tabs {
      display: flex;
      overflow-x: auto;
      gap: 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .feature-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0;
      padding: 1rem 1.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.4);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: rgba(255,255,255,0.7); }
    .tab-btn.active { color: #F5A623; border-bottom-color: #F5A623; }
    .tab-btn[data-tab="analyzer"].active { color: #F5A623; border-bottom-color: #F5A623; }
    .tab-btn[data-tab="heatmap"].active { color: #06B6D4; border-bottom-color: #06B6D4; }
    .tab-btn[data-tab="history"].active { color: #A855F7; border-bottom-color: #A855F7; }
    .tab-btn[data-tab="export"].active { color: #10B981; border-bottom-color: #10B981; }
    .tab-btn[data-tab="quiz"].active { color: #F43F5E; border-bottom-color: #F43F5E; }
    .tab-btn[data-tab="diff"].active { color: #6366F1; border-bottom-color: #6366F1; }

    .tab-panel {
      display: none;
      animation: tabFadeIn 0.4s ease;
    }
    .tab-panel.active { display: block; }
    @keyframes tabFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── HEATMAP GRID ─── */
    .heatmap-grid {
      display: grid;
      grid-template-columns: 60px repeat(24, 1fr);
      gap: 2px;
    }
    .heatmap-cell {
      aspect-ratio: 1;
      border-radius: 4px;
      transition: all 0.3s;
      cursor: pointer;
      position: relative;
      min-height: 18px;
    }
    .heatmap-cell:hover {
      transform: scale(1.3);
      z-index: 10;
      box-shadow: 0 0 12px currentColor;
    }
    .heatmap-label {
      display: flex;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .heatmap-hour-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.55rem;
      font-weight: 600;
      text-align: center;
      padding: 2px 0;
    }

    /* ─── FREQUENCY STAT CARD ─── */
    .freq-card {
      background: rgba(5,5,6,0.6);
      border: 1px solid rgba(245,166,35,0.12);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .freq-card:hover {
      border-color: rgba(245,166,35,0.3);
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(245,166,35,0.1);
    }
    .freq-number {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 900;
      font-size: 2.2rem;
      line-height: 1;
    }

    /* ─── QUIZ MODE ─── */
    .quiz-input {
      background: rgba(5,5,6,0.8);
      border: 2px solid rgba(244,63,94,0.2);
      color: #FFFFFF;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.15em;
      padding: 1rem;
      border-radius: 10px;
      outline: none;
      transition: all 0.3s;
      width: 100%;
    }
    .quiz-input:focus {
      border-color: #F43F5E;
      box-shadow: 0 0 0 3px rgba(244,63,94,0.15), 0 0 30px rgba(244,63,94,0.08);
    }
    .quiz-input.correct {
      border-color: #10B981 !important;
      box-shadow: 0 0 0 3px rgba(16,185,129,0.2), 0 0 30px rgba(16,185,129,0.15) !important;
    }
    .quiz-input.wrong {
      border-color: #F43F5E !important;
      box-shadow: 0 0 0 3px rgba(244,63,94,0.2), 0 0 30px rgba(244,63,94,0.15) !important;
      animation: shake 0.5s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .difficulty-btn {
      padding: 0.6rem 1.5rem;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border: 1px solid;
      cursor: pointer;
      transition: all 0.3s;
    }
    .difficulty-btn.easy { color: #10B981; border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
    .difficulty-btn.easy:hover, .difficulty-btn.easy.active { background: rgba(16,185,129,0.15); border-color: #10B981; }
    .difficulty-btn.medium { color: #F5A623; border-color: rgba(245,166,35,0.3); background: rgba(245,166,35,0.05); }
    .difficulty-btn.medium:hover, .difficulty-btn.medium.active { background: rgba(245,166,35,0.15); border-color: #F5A623; }
    .difficulty-btn.hard { color: #F43F5E; border-color: rgba(244,63,94,0.3); background: rgba(244,63,94,0.05); }
    .difficulty-btn.hard:hover, .difficulty-btn.hard.active { background: rgba(244,63,94,0.15); border-color: #F43F5E; }

    /* ─── EXPORT FORMAT CARD ─── */
    .export-card {
      background: rgba(5,5,6,0.6);
      border: 1px solid rgba(16,185,129,0.15);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s;
    }
    .export-card:hover {
      border-color: rgba(16,185,129,0.35);
      box-shadow: 0 4px 20px rgba(16,185,129,0.08);
    }
    .export-card-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid rgba(16,185,129,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .export-card pre {
      padding: 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      line-height: 1.6;
      color: rgba(255,255,255,0.85);
      overflow-x: auto;
      white-space: pre;
    }

    /* ─── DIFF COMPARATOR ─── */
    .diff-field {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      transition: all 0.3s;
    }
    .diff-same { background: rgba(16,185,129,0.06); border: 1px solid rgba(16,185,129,0.15); }
    .diff-changed { background: rgba(244,63,94,0.06); border: 1px solid rgba(244,63,94,0.2); }

    /* ─── NUMBER ROLL-UP ANIMATION ─── */
    @keyframes rollUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .roll-up { animation: rollUp 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

    /* ─── STREAK FLAME ─── */
    @keyframes flame {
      0%, 100% { transform: scaleY(1) rotate(-2deg); }
      50% { transform: scaleY(1.15) rotate(2deg); }
    }
    .streak-flame { animation: flame 0.4s ease infinite; }

    /* ─── CARD ENTRANCE STAGGER ─── */
    .stagger-1 { transition-delay: 0.05s; }
    .stagger-2 { transition-delay: 0.1s; }
    .stagger-3 { transition-delay: 0.15s; }
    .stagger-4 { transition-delay: 0.2s; }
    .stagger-5 { transition-delay: 0.25s; }

    /* ─── TOOLTIP ─── */
    .heatmap-tooltip {
      position: fixed;
      padding: 6px 12px;
      background: rgba(0,0,0,0.95);
      border: 1px solid rgba(245,166,35,0.3);
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 600;
      color: #FFFFFF;
      pointer-events: none;
      z-index: 9999;
      display: none;
      white-space: nowrap;
    }
  <script src="/affilore-monetization.js"></script>
</head>

    <!-- Header Unit -->
    <header class="mb-10 flex flex-col items-start md:items-center text-left md:text-center scroll-reveal">
      <h1 class="text-5xl md:text-6xl font-black font-display tracking-tight mb-4">
        <span class="animated-gradient-text">CRON ENGINE OS</span>
      </h1>
      <p class="text-white/80 text-base md:text-lg font-bold max-w-2xl font-sans">
        High-fidelity scheduling syntax generator and parser for Affilore systems.
      </p>

      <!-- Engine Ribbon Container -->
      <div class="mt-8 flex items-center justify-between w-full max-w-5xl border border-[rgba(16,185,129,0.15)] rounded-lg px-5 py-4 glass">
        <div class="flex items-center gap-3">
          <span class="w-2.5 h-2.5 rounded-full bg-emeraldCore pulse-dot"></span>
          <span class="text-sm font-mono font-bold text-emeraldCore uppercase tracking-widest">Engine: Operational</span>
        </div>
        <div class="hidden md:flex items-center gap-6 text-[11px] font-mono font-bold text-white/60 uppercase tracking-widest">

       ═══════════════════════════════════════════════════════════════ -->
  <script>
    (function() {
      const canvas = document.getElementById('shader-canvas');
      if (!canvas) return;
      function syncSize() {
        const w = window.innerWidth; const h = window.innerHeight;
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      }
      window.addEventListener('resize', syncSize); syncSize();
      const gl = canvas.getContext('webgl'); if (!gl) return;
      const vs = `attribute vec2 a_position; varying vec2 v_texCoord; void main() { v_texCoord = a_position * 0.5 + 0.5; gl_Position = vec4(a_position, 0.0, 1.0); }`;
      const fs = `precision highp float; varying vec2 v_texCoord; uniform float u_time; uniform vec2 u_resolution;
      float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
      void main() {
          vec2 uv = v_texCoord;
          vec3 color = vec3(0.0, 0.0, 0.0);
          for(int i = 0; i < 35; i++) {
              float fi = float(i);
              vec2 initPos = vec2(hash(vec2(fi, 12.0)), hash(vec2(fi, 13.0)));
              vec2 dir = vec2(hash(vec2(fi, 2.0)) * 2.0 - 1.0, hash(vec2(fi, 3.0)) * 2.0 - 1.0);
              
              // Drift with coordinate space wrap-around (corrected relative to uv coordinate)
              vec2 diff = fract(uv - (initPos + u_time * 0.012 * dir)) - 0.5;
              
              // Aspect ratio correction for circles
              diff.x *= u_resolution.x / u_resolution.y;
              
              float dist = length(diff);
              float size = 0.0015 + 0.0015 * hash(vec2(fi, 4.0));
              
              // Core dot + glow falloff formula
              float core = smoothstep(size, 0.0, dist);
              float glow = exp(-dist * 70.0) * 0.55;
              float alpha = (core + glow) * (0.25 + 0.75 * sin(u_time * 0.7 + fi * 1.8));
              
              // Yellow to Amber/Orange gradient mix matching the uploaded screenshots
              float colorShift = fract(sin(fi * 45.0) * 987.0);
              vec3 goldYellow = vec3(0.98, 0.82, 0.08);
              vec3 amberOrange = vec3(0.96, 0.56, 0.05);
              vec3 dotColor = mix(goldYellow, amberOrange, clamp(colorShift + 0.3 * sin(u_time * 0.5 + fi), 0.0, 1.0));
              
              color += dotColor * alpha;
          }
          gl_FragColor = vec4(color, 1.0);
      }`;
      function cs(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
      const prog = gl.createProgram(); gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog); gl.useProgram(prog);
      const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const pos = gl.getAttribLocation(prog, 'a_position'); gl.enableVertexAttribArray(pos); gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
      const uTime = gl.getUniformLocation(prog, 'u_time'); const uRes = gl.getUniformLocation(prog, 'u_resolution');
      function render(t) {
        gl.viewport(0, 0, canvas.width, canvas.height);
        if (uTime) gl.uniform1f(uTime, t * 0.001);
        if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(render);
      }
      render(0);
    })();
  </script>

  <script>
    function createParticleBurst(x, y, color, count = 24) {
      const container = document.createElement('div');
      container.style.cssText = `position:fixed;left:${x}px;top:${y}px;pointer-events:none;z-index:9999;`;
      document.body.appendChild(container);
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
        const velocity = 40 + Math.random() * 120;
        const size = 2 + Math.random() * 5;
        p.style.cssText = `position:absolute;width:${size}px;height:${size}px;border-radius:50%;background:${color};box-shadow:0 0 6px ${color};`;
        container.appendChild(p);
        p.animate([
          { transform: 'translate(0, 0) scale(1)', opacity: 1 },
          { transform: `translate(${Math.cos(angle) * velocity}px, ${Math.sin(angle) * velocity}px) scale(0)`, opacity: 0 }
        ], { duration: 500 + Math.random() * 500, easing: 'cubic-bezier(0, 0.9, 0.57, 1)' });
      }
      setTimeout(() => container.remove(), 1200);
    }

    // Ripple effect for all .btn-ripple buttons
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.btn-ripple');
      if (!btn) return;
      const rect = btn.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple-wave';
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 700);
    });

    // Scroll Reveal with IntersectionObserver
    document.addEventListener('DOMContentLoaded', () => {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add('animate-in');
            observer.unobserve(e.target);
          }
        });
      }, { threshold: 0.08 });
      document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));
    });
  </script>

          { desc: "Every minute, every day", answers: ["* * * * *"] },
          { desc: "Once every hour at minute 0", answers: ["0 * * * *"] },
          { desc: "Once a day at midnight", answers: ["0 0 * * *"] },
          { desc: "Every day at noon (12 PM)", answers: ["0 12 * * *"] },
          { desc: "Every Sunday at midnight", answers: ["0 0 * * 0"] },
          { desc: "Every day at 6 AM", answers: ["0 6 * * *"] },
          { desc: "Every day at 9 PM", answers: ["0 21 * * *"] },
          { desc: "First day of every month at midnight", answers: ["0 0 1 * *"] },
        ],
        medium: [
          { desc: "Every 15 minutes", answers: ["*/15 * * * *"] },
          { desc: "Every weekday (Mon-Fri) at 9 AM", answers: ["0 9 * * 1-5"] },
          { desc: "Every 6 hours", answers: ["0 */6 * * *"] },
          { desc: "Every 30 minutes during business hours (9-17)", answers: ["*/30 9-17 * * *"] },
          { desc: "Every Monday at 8 AM", answers: ["0 8 * * 1"] },
          { desc: "Twice a day at 6 AM and 6 PM", answers: ["0 6,18 * * *"] },
          { desc: "Every 10 minutes on weekdays", answers: ["*/10 * * * 1-5"] },
          { desc: "Every day at 3:30 AM", answers: ["30 3 * * *"] },
        ],
        hard: [
          { desc: "Every 5 minutes between 9 AM and 5 PM on weekdays", answers: ["*/5 9-17 * * 1-5"] },
          { desc: "At 9:30 AM on Monday, Wednesday, and Friday", answers: ["30 9 * * 1,3,5"] },
          { desc: "Every 15th and last day of the month at noon", answers: ["0 12 15,28,29,30,31 * *"] },
          { desc: "Every quarter hour on Jan, Apr, Jul, Oct", answers: ["*/15 * * 1,4,7,10 *"] },
          { desc: "At minute 0 and 30, hours 8-18, on weekdays", answers: ["0,30 8-18 * * 1-5"] },
          { desc: "Every 2 hours between 6 AM and 10 PM", answers: ["0 6-22/2 * * *"] },
          { desc: "At 11:30 PM on the 1st and 15th of every month", answers: ["30 23 1,15 * *"] },
          { desc: "Every minute on Saturday and Sunday", answers: ["* * * * 0,6", "* * * * 6,0"] },
        ]
      };

      // ─── CORE HELPERS ───
      function inRange(val, idx) { const [lo, hi] = FIELD_RANGES[idx]; return val >= lo && val <= hi; }
      function arrayRange(start, end) { const arr = []; for (let i = start; i <= end; i++) arr.push(i); return arr; }

      function expandToken(token, idx) {
        const [lo, hi] = FIELD_RANGES[idx];
        if (token === '*') return arrayRange(lo, hi);
        if (token.includes('/')) {
          const [base, stepStr] = token.split('/');
          const step = parseInt(stepStr, 10);
          if (isNaN(step) || step <= 0) throw new Error();
          let start, end;
          if (base === '*') { start = lo; end = hi; }
          else if (base.includes('-')) { [start, end] = base.split('-').map(Number); }
          else { start = parseInt(base, 10); end = hi; }
          const vals = []; for (let v = start; v <= end; v += step) vals.push(v); return vals;
        }
        if (token.includes('-')) {
          const [s, e] = token.split('-').map(Number);
          if (s > e) throw new Error(); return arrayRange(s, e);
        }
        return [parseInt(token, 10)];
      }

      // Tokenize
      function tokenize(expr) {
        const parts = expr.trim().split(/\s+/);
        if (parts.length !== 5) throw new Error("Requires 5 fields");
        const fields = [];
        for (let i = 0; i < 5; i++) {
          let resolved = parts[i].toUpperCase();
          const subs = resolved.split(','); const merged = new Set();
          for (const sub of subs) { for (const v of expandToken(sub.trim(), i)) { if(isNaN(v) || !inRange(v, i)) throw new Error("Out of range"); merged.add(v); } }
          fields.push([...merged].sort((a, b) => a - b));
        }
        return fields;
      }

      function nextExecutions(fields, count = 5) {
        const [mins, hrs, doms, mons, dows] = fields;
        const results = [];
        let cur = new Date(); cur.setSeconds(0, 0); cur.setMinutes(cur.getMinutes() + 1);
        let iter = 0;
        while (results.length < count && iter < 50000) {
          iter++;
          if (!mons.includes(cur.getMonth() + 1)) { cur.setMonth(cur.getMonth() + 1, 1); cur.setHours(0, 0, 0, 0); continue; }
          if (!doms.includes(cur.getDate())) { cur.setDate(cur.getDate() + 1); cur.setHours(0, 0, 0, 0); continue; }
          if (!dows.includes(cur.getDay())) { cur.setDate(cur.getDate() + 1); cur.setHours(0, 0, 0, 0); continue; }
          if (!hrs.includes(cur.getHours())) { cur.setHours(cur.getHours() + 1, 0, 0, 0); continue; }
          if (!mins.includes(cur.getMinutes())) { cur.setMinutes(cur.getMinutes() + 1, 0, 0); continue; }
          results.push(new Date(cur)); cur.setMinutes(cur.getMinutes() + 1);
        }
        return results;
      }

      // ─── FREQUENCY ANALYZER ───
      function calculateFrequency(fields) {
        const [mins, hrs, doms, mons, dows] = fields;
        const perHour = mins.length;
        const perDay = mins.length * hrs.length;
        const perWeek = perDay * dows.length;
        const avgDaysPerMonth = doms.length;
        const perMonth = perDay * avgDaysPerMonth;
        const perYear = perMonth * mons.length;
        return { perHour, perDay, perWeek, perMonth, perYear };
      }

      function updateFrequencyDisplay(fields) {
        const freq = calculateFrequency(fields);
        animateNumber($freqHour, freq.perHour);
        animateNumber($freqDay, freq.perDay);
        animateNumber($freqWeek, freq.perWeek);
        animateNumber($freqMonth, freq.perMonth);
        animateNumber($freqYear, freq.perYear);
        animateNumber($mFreqDay, freq.perDay);
      }

      function animateNumber(el, target) {
        const current = parseInt(el.textContent) || 0;
        if (current === target) return;
        const duration = 400;
        const start = performance.now();
        function step(ts) {
          const progress = Math.min((ts - start) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          el.textContent = Math.round(current + (target - current) * eased).toLocaleString();
          if (progress < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      // ─── LIVE COUNTDOWN ───
      function startCountdown(nextDate) {
        if (countdownInterval) clearInterval(countdownInterval);
        state.nextExecDate = nextDate;
        function tick() {
          if (!state.nextExecDate) return;
          const diff = state.nextExecDate - new Date();
          if (diff <= 0) {
            $cdH.textContent = '00'; $cdM.textContent = '00'; $cdS.textContent = '00';
            return;
          }
          const h = Math.floor(diff / 3600000);
          const m = Math.floor((diff % 3600000) / 60000);
          const s = Math.floor((diff % 60000) / 1000);
          $cdH.textContent = String(h).padStart(2, '0');
          $cdM.textContent = String(m).padStart(2, '0');
          $cdS.textContent = String(s).padStart(2, '0');
        }
        tick();
        countdownInterval = setInterval(tick, 1000);
      }

      // ─── WEEKLY HEATMAP ───
      function buildHeatmap(fields) {
        if (!fields) return;
        const [mins, hrs, , , dows] = fields;
        $heatmapGrid.innerHTML = '';

        // Header row: empty corner + 24 hour labels
        const corner = document.createElement('div');
        corner.className = 'heatmap-label';
        $heatmapGrid.appendChild(corner);
        for (let h = 0; h < 24; h++) {
          const lbl = document.createElement('div');
          lbl.className = 'heatmap-hour-label text-white/25';
          lbl.textContent = String(h).padStart(2, '0');
          $heatmapGrid.appendChild(lbl);
        }

        // 7 day rows
        for (let d = 0; d < 7; d++) {
          const dayLabel = document.createElement('div');
          dayLabel.className = 'heatmap-label';
          dayLabel.innerHTML = `<span class="${dows.includes(d) ? 'text-cyanCore' : 'text-white/20'}">${DAY_NAMES[d]}</span>`;
          $heatmapGrid.appendChild(dayLabel);

          for (let h = 0; h < 24; h++) {
            const cell = document.createElement('div');
            cell.className = 'heatmap-cell';
            const isActive = dows.includes(d) && hrs.includes(h);
            const intensity = isActive ? mins.length / 60 : 0;

            if (intensity > 0) {
              const alpha = 0.08 + intensity * 0.92;
              cell.style.background = `rgba(6, 182, 212, ${alpha})`;
              cell.style.color = '#06B6D4';
              cell.style.boxShadow = intensity > 0.5 ? `0 0 8px rgba(6,182,212,${intensity * 0.4})` : 'none';
            } else {
              cell.style.background = 'rgba(6, 182, 212, 0.03)';
              cell.style.border = '1px solid rgba(6,182,212,0.06)';
            }

            // Tooltip
            cell.addEventListener('mouseenter', (e) => {
              $heatmapTooltip.textContent = `${DAY_NAMES[d]} ${String(h).padStart(2,'0')}:00 — ${isActive ? mins.length + ' fires/hr' : 'Inactive'}`;
              $heatmapTooltip.style.display = 'block';
              $heatmapTooltip.style.left = (e.clientX + 12) + 'px';
              $heatmapTooltip.style.top = (e.clientY - 30) + 'px';
            });
            cell.addEventListener('mousemove', (e) => {
              $heatmapTooltip.style.left = (e.clientX + 12) + 'px';
              $heatmapTooltip.style.top = (e.clientY - 30) + 'px';
            });
            cell.addEventListener('mouseleave', () => {
              $heatmapTooltip.style.display = 'none';
            });

            $heatmapGrid.appendChild(cell);
          }
        }
      }

      // ─── EXPRESSION HISTORY ───
      function saveToHistory(expr) {
        let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
        history = history.filter(h => h !== expr);
        history.unshift(expr);
        if (history.length > 10) history = history.slice(0, 10);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        renderHistory();
      }

      function renderHistory() {
        const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
        if (history.length === 0) {
          $histList.innerHTML = '<div class="text-white/30 italic font-mono text-sm text-center py-6">No history yet. Compile an expression to start.</div>';
          return;
        }
        $histList.innerHTML = history.map((expr, i) => {
          let desc = '';
          try { if (window.cronstrue) desc = window.cronstrue.toString(expr); } catch(e) {}
          return `<div class="flex items-center justify-between bg-[rgba(168,85,247,0.03)] border border-[rgba(168,85,247,0.1)] p-3 rounded-lg hover:border-purpleCore/30 transition cursor-pointer group" onclick="document.getElementById('cronInput').value='${expr}'; CronApp.syncFromUnified();">
            <div class="flex-grow">
              <div class="font-mono font-bold text-sm text-purpleCore tracking-wider">${expr}</div>
              <div class="text-xs text-white/40 mt-1">${desc}</div>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-[9px] font-mono font-bold text-white/20 group-hover:text-white/40">#${i + 1}</span>
            </div>
          </div>`;
        }).join('');
      }

      // ─── MULTI-FORMAT EXPORT ───
      function updateExport(expr) {
        const formats = [
          {
            name: 'Standard Crontab',
            icon: 'terminal',
            color: '#F5A623',
            code: `# Affilore Cron Schedule\n# Generated: ${new Date().toISOString()}\n${expr}  /usr/bin/your-command --arg1 value`

        $exportGrid.innerHTML = formats.map(f => `

              </div>

              </button>

            <pre>${escapeHtml(f.code)}</pre>

      }

      function escapeHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      // ─── QUIZ MODE ───
      function loadQuizState() {
        try {
          const saved = JSON.parse(localStorage.getItem(QUIZ_KEY) || '{}');
          state.quizScore = saved.score || 0;
          state.quizBest = saved.best || 0;
          state.quizStreak = 0;
          $quizScore.textContent = state.quizScore;
          $quizBest.textContent = state.quizBest;
          $quizStreak.textContent = '0';
        } catch(e) {}
      }

      function saveQuizState() {
        localStorage.setItem(QUIZ_KEY, JSON.stringify({
          score: state.quizScore,
          best: state.quizBest
        }));
      }

      function fieldsEqual(a, b) {
        try {
          const fA = tokenize(a);
          const fB = tokenize(b);
          for (let i = 0; i < 5; i++) {
            if (fA[i].length !== fB[i].length) return false;
            for (let j = 0; j < fA[i].length; j++) {
              if (fA[i][j] !== fB[i][j]) return false;
            }
          }
          return true;
        } catch(e) { return false; }
      }

      // ─── DIFF COMPARATOR ───
      function runDiffInternal() {
        const exprA = $diffA.value.trim();
        const exprB = $diffB.value.trim();
        if (!exprA || !exprB) {
          $diffResults.innerHTML = '<div class="text-white/30 italic font-mono text-sm text-center py-6">Enter two expressions to compare.</div>';
          $diffSummary.innerHTML = '';
          return;
        }

        let fieldsA, fieldsB;
        try { fieldsA = tokenize(exprA); } catch(e) {
          $diffResults.innerHTML = '<div class="text-roseCore font-mono text-sm text-center py-4">⚠ Expression A is invalid</div>';
          $diffSummary.innerHTML = ''; return;
        }
        try { fieldsB = tokenize(exprB); } catch(e) {
          $diffResults.innerHTML = '<div class="text-roseCore font-mono text-sm text-center py-4">⚠ Expression B is invalid</div>';
          $diffSummary.innerHTML = ''; return;
        }

        const partsA = exprA.split(/\s+/);
        const partsB = exprB.split(/\s+/);
        let diffCount = 0;

        $diffResults.innerHTML = FIELD_LABELS.map((label, i) => {
          const same = partsA[i] === partsB[i];
          if (!same) diffCount++;
          return `<div class="diff-field ${same ? 'diff-same' : 'diff-changed'}">
            <span class="w-20 text-[10px] font-mono font-bold uppercase tracking-widest" style="color:${FIELD_COLORS[i]}">${label.split(' ')[0]}</span>
            <div class="flex-grow grid grid-cols-2 gap-4">
              <div class="font-mono font-bold text-sm ${same ? 'text-white/60' : 'text-white'}">${partsA[i]}</div>
              <div class="font-mono font-bold text-sm ${same ? 'text-white/60' : 'text-white'}">${partsB[i]}</div>
            </div>
            <span class="material-symbols-outlined text-[16px] ${same ? 'text-emeraldCore/40' : 'text-roseCore'}">${same ? 'check_circle' : 'change_circle'}</span>
          </div>`;
        }).join('');

        // Summary
        const freqA = calculateFrequency(fieldsA);
        const freqB = calculateFrequency(fieldsB);
        const dayDiff = freqA.perDay - freqB.perDay;

        $diffSummary.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-mono text-[11px] font-bold text-indigoCore/70 uppercase tracking-widest">${diffCount} field${diffCount !== 1 ? 's' : ''} differ</span>
            <span class="font-mono text-[11px] font-bold ${dayDiff > 0 ? 'text-amberCore' : dayDiff < 0 ? 'text-cyanCore' : 'text-emeraldCore'} uppercase tracking-widest">
              ${dayDiff === 0 ? 'Same daily frequency' : `A fires ${Math.abs(dayDiff)} ${dayDiff > 0 ? 'more' : 'fewer'}/day`}
            </span>
          </div>
        `;
      }

      // ─── MAIN PROCESS ───
      function process(expr, withParticles) {
        if (!expr.trim()) return;
        try {
          const fields = tokenize(expr);
          state.currentFields = fields;

          // Translation
          if (window.cronstrue) {
            const translation = window.cronstrue.toString(expr);
            $output.innerHTML = `<span class="cron-seg hr">${translation}</span>`;
          } else {
            $output.innerHTML = `<span class="text-white">Valid Syntax.</span>`;
          }

          // Executions
          const upcoming = nextExecutions(fields, 5);
          if (upcoming.length > 0) {
            $execList.innerHTML = upcoming.map((d, i) => {
              const timeStr = d.toISOString().replace('T', ' ').substring(0, 16) + ' UTC';
              return `<li class="flex items-center gap-3 bg-[rgba(6,182,212,0.03)] border border-[rgba(6,182,212,0.1)] p-3 rounded text-white">
                <span class="text-cyanCore font-bold text-xs bg-cyanCore/10 border border-cyanCore/30 px-2 py-0.5 rounded">#${i + 1}</span>
                <span class="font-mono font-bold tracking-wide">${timeStr}</span>
              </li>`;
            }).join('');

            // Countdown
            startCountdown(upcoming[0]);
          }

          // Metrics
          if (state.lastValid !== expr) { state.compiledCount++; state.lastValid = expr; }
          animateNumber($mGen, state.compiledCount);

          const complexityScore = expr.split(/\s+/).filter(p => p !== '*').length;
          $mComp.textContent = complexityScore >= 3 ? 'Complex' : complexityScore >= 1 ? 'Medium' : 'Simple';
          $mComp.className = `font-mono text-3xl font-black ${complexityScore >= 3 ? 'text-roseCore' : complexityScore >= 1 ? 'text-amberCore' : 'text-cyanCore'}`;

          // Frequency Analyzer
          updateFrequencyDisplay(fields);

          // Heatmap
          buildHeatmap(fields);

          // History
          saveToHistory(expr);

          // Export
          updateExport(expr);

          // Particle burst on compile button
          if (withParticles) {
            const btn = document.querySelector('[onclick="CronApp.syncFromUnified(true)"]');
            if (btn) {
              const rect = btn.getBoundingClientRect();
              createParticleBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, '#F5A623', 30);
            }
          }

        } catch (err) {
          $output.innerHTML = `<span class="text-roseCore font-bold font-sans">⚠ Syntax Error: Check token boundaries.</span>`;
          $execList.innerHTML = `<li class="text-roseCore/60 italic text-center py-4 border border-dashed border-roseCore/20 rounded">Awaiting valid syntax repair...</li>`;
          $mComp.textContent = 'Invalid';
          $mComp.className = 'font-mono text-3xl font-black text-roseCore';
          $cdH.textContent = '--'; $cdM.textContent = '--'; $cdS.textContent = '--';
          if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
        }
      }

      // ─── GLOWING INPUT EFFECT ───
      let glowTimeout;
      function triggerGlow() {
        $input.classList.add('glow-typing');
        clearTimeout(glowTimeout);
        glowTimeout = setTimeout(() => $input.classList.remove('glow-typing'), 2000);
      }

      // ─── PUBLIC INTERFACE ───
      return {
        // Tab Switching
        switchTab(tabName) {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
          document.querySelector(`.tab-btn[data-tab="${tabName}"]`).classList.add('active');
          document.getElementById(`tab-${tabName}`).classList.add('active');
        },

        syncFromUnified(withParticles = false) {
          if (state.syncing) return; state.syncing = true;
          const expr = $input.value.trim(); const parts = expr.split(/\s+/);
          for (let i = 0; i < 5; i++) $segInputs[i].value = parts[i] || '';
          process(expr, withParticles); state.syncing = false;
        },

        syncFromSegments() {
          if (state.syncing) return; state.syncing = true;
          const expr = $segInputs.map(el => el.value.trim() || '*').join(' ');
          $input.value = expr; process(expr, false); state.syncing = false;
        },

        copyToClipboard() {
          navigator.clipboard.writeText($input.value).then(() => {
            const btn = document.querySelector('[onclick="CronApp.copyToClipboard()"]');
            if (btn) {
              const rect = btn.getBoundingClientRect();
              createParticleBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, '#F5A623', 12);
              const original = btn.innerHTML;
              btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span> COPIED!';
              setTimeout(() => btn.innerHTML = original, 1500);
            }
          });
        },

        clearWorkspace() {
          $input.value = '* * * * *'; this.syncFromUnified();
        },

        shareURL() {
          const expr = $input.value.trim();
          const url = window.location.origin + window.location.pathname + '#cron=' + encodeURIComponent(expr);
          navigator.clipboard.writeText(url).then(() => {
            const btn = document.querySelector('[onclick="CronApp.shareURL()"]');
            if (btn) {
              const rect = btn.getBoundingClientRect();
              createParticleBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, '#A855F7', 16);
              const original = btn.innerHTML;
              btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span> LINK COPIED!';
              setTimeout(() => btn.innerHTML = original, 2000);
            }
          });
        },

        // History
        clearHistory() {
          localStorage.removeItem(HISTORY_KEY);
          renderHistory();
        },

        // Favorites
        saveSnippet() {
          const name = $snippetName.value.trim();
          if (!name) { alert("Please provide a label for the snippet."); return; }
          try { tokenize($input.value.trim()); } catch(e) { alert("Cannot save invalid expression."); return; }
          state.favorites.push({ name: name, expr: $input.value.trim() });
          $snippetName.value = '';
          const btn = document.querySelector('[onclick="CronApp.saveSnippet()"]');
          if (btn) {
            const rect = btn.getBoundingClientRect();
            createParticleBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, '#10B981', 20);
          }
          this.renderFavorites(); this.syncToCloud();
        },

        deleteSnippet(idx) {
          state.favorites.splice(idx, 1); this.renderFavorites(); this.syncToCloud();
        },

        renderFavorites() {
          $favList.innerHTML = state.favorites.length === 0
            ? `<div class="text-white/30 italic font-mono text-sm">No saved snippets found.</div>`
            : state.favorites.map((f, i) => `
              <div class="flex items-center justify-between bg-[rgba(168,85,247,0.03)] border border-[rgba(168,85,247,0.1)] p-3 rounded-lg hover:border-purpleCore/30 transition">
                <div class="cursor-pointer flex-grow" onclick="document.getElementById('cronInput').value='${f.expr}'; CronApp.syncFromUnified();">
                  <div class="text-white font-bold text-sm mb-1">${f.name}</div>
                  <div class="text-amberCore font-mono text-xs tracking-widest">${f.expr}</div>
                </div>
                <button onclick="CronApp.deleteSnippet(${i})" class="text-white/20 hover:text-roseCore text-xs font-bold font-mono ml-3 transition">✕</button>
              </div>`).join('');
        },

        syncToCloud() {
          if (currentUid && db) {
            $mSync.textContent = 'Syncing...'; $mSync.className = 'font-mono text-3xl font-black text-amberCore';
            setDoc(doc(db, "users", currentUid, "tools", "cron_generator"), { favorites: state.favorites }).then(() => {
              $mSync.textContent = 'Online'; $mSync.className = 'font-mono text-3xl font-black text-purpleCore';
            }).catch(() => {});
          }
        },

        async loadCloudFavorites() {
          if (!currentUid || !db) return;
          try {
            const snap = await getDoc(doc(db, "users", currentUid, "tools", "cron_generator"));
            if (snap.exists()) { state.favorites = snap.data().favorites || []; this.renderFavorites(); }
          } catch(e) {}
        },

        // ─── QUIZ MODE ───
        setQuizDifficulty(level) {
          state.quizDifficulty = level;
          document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
          document.querySelector(`.difficulty-btn.${level}`).classList.add('active');
          this.newQuizQuestion();
        },

        newQuizQuestion() {
          const pool = quizDB[state.quizDifficulty];
          let q;
          do { q = pool[Math.floor(Math.random() * pool.length)]; } while (q === state.currentQuiz && pool.length > 1);
          state.currentQuiz = q;
          $quizQ.textContent = q.desc;
          $quizA.value = '';
          $quizA.className = 'quiz-input';
          $quizFeedback.innerHTML = '';
          $quizA.focus();
        },

        checkQuizAnswer() {
          if (!state.currentQuiz) { this.newQuizQuestion(); return; }
          const answer = $quizA.value.trim();
          if (!answer) return;

          const isCorrect = state.currentQuiz.answers.some(a => fieldsEqual(answer, a));

          if (isCorrect) {
            $quizA.className = 'quiz-input correct';
            state.quizScore += state.quizDifficulty === 'hard' ? 3 : state.quizDifficulty === 'medium' ? 2 : 1;
            state.quizStreak++;
            if (state.quizStreak > state.quizBest) state.quizBest = state.quizStreak;
            $quizFeedback.innerHTML = '<span class="text-emeraldCore">✓ Correct! Well done.</span>';

            // Particle burst on correct
            const rect = $quizA.getBoundingClientRect();
            createParticleBurst(rect.left + rect.width / 2, rect.top, '#10B981', 30);

            // Auto next after delay
            setTimeout(() => this.newQuizQuestion(), 1500);
          } else {
            $quizA.className = 'quiz-input wrong';
            state.quizStreak = 0;
            const correctAnswer = state.currentQuiz.answers[0];
            $quizFeedback.innerHTML = `<span class="text-roseCore">✗ Incorrect.</span> <span class="text-white/50">Expected:</span> <span class="text-amberCore font-mono">${correctAnswer}</span>`;
          }

          $quizScore.textContent = state.quizScore;
          $quizStreak.textContent = state.quizStreak;
          $quizBest.textContent = state.quizBest;
          $streakFlame.style.display = state.quizStreak >= 3 ? 'inline' : 'none';
          saveQuizState();
        },

        showQuizHint() {
          if (!state.currentQuiz) return;
          const answer = state.currentQuiz.answers[0];
          const parts = answer.split(' ');
          const hints = parts.map((p, i) => `<span style="color:${FIELD_COLORS[i]}">${FIELD_LABELS[i]}: <strong>${p}</strong></span>`);
          $quizFeedback.innerHTML = `<div class="text-left inline-flex flex-wrap gap-3">${hints.join('')}</div>`;
        },

        // ─── DIFF COMPARATOR ───
        runDiff() { runDiffInternal(); },

        // ─── INIT ───
        initBindings() {
          $input.addEventListener('input', () => { triggerGlow(); this.syncFromUnified(); });
          $segInputs.forEach(seg => seg.addEventListener('input', () => this.syncFromSegments()));
          document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              $input.value = btn.dataset.cron;
              this.syncFromUnified();
              const rect = btn.getBoundingClientRect();
              createParticleBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, '#06B6D4', 10);
            });
          });

          // Load from URL hash
          const hash = window.location.hash;
          if (hash.startsWith('#cron=')) {
            const expr = decodeURIComponent(hash.substring(6));
            $input.value = expr;
          }

          loadQuizState();
          renderHistory();

          setTimeout(() => this.syncFromUnified(), 100);
          setTimeout(() => runDiffInternal(), 200);
        }
      };
    })();

    // Boot App
    window.addEventListener('DOMContentLoaded', () => { CronApp.initBindings(); });
  </script>
</body>
</html>
